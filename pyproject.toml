[project]
name = "100daydash-blog"
version = "0.1.0"
description = "100 dashboards in 100 days"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.9",
]

[dependency-groups]
dev = [
    "bandit>=1.7.10",
    "detect-secrets>=1.5.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["dashboards/day-[0-9][0-9][0-9]-.*/(src|tests)/.*\\.py"]

[tool.pytest.ini_options]
testpaths = ["dashboards", "scripts"]
python_files = ["test_*.py"]
addopts = "-ra --import-mode=importlib --basetemp=.pytest-tmp --cov=dashboards --cov=scripts --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["dashboards", "scripts"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
