name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-quality:
    name: Python Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Validate dashboard metadata
        run: uv run python scripts/validate-dashboard-metadata.py

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy .

      - name: Pytest
        run: uv run pytest --cov

      - name: Bandit
        run: uv run bandit -r dashboards scripts -x "*/tests/*"

      - name: Detect secrets
        run: |
          uv run detect-secrets scan \
            --baseline .secrets.baseline \
            --exclude-files "(^|[\\/])(.venv|venv|node_modules|dist|build|coverage|htmlcov|.astro|.git|.mypy_cache|.pytest_cache|.ruff_cache|__pycache__)([\\/]|$)|^\.secrets\.baseline$|^uv\.lock$|^pnpm-lock\.yaml$"

  web-quality:
    name: Web Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
